name: Collecte des offres

# Toutes les 2 heures + à la demande (bouton "Run workflow", ou appli
# ouverte avec des données périmées → Supabase déclenche ce workflow).
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: "Origine du déclenchement"
        required: false
        default: manual

# Une seule collecte à la fois ; une demande arrivée pendant une collecte attend.
concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write   # uniquement pour le commit vide de maintien (voir dernière étape)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Tests (le collecteur ne tourne pas si un test échoue)
        run: npm test

      - name: Collecte → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_CONTACT_URL: https://github.com/${{ github.repository }}
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
        run: node collector/index.mjs

      # GitHub suspend les tâches planifiées d'un dépôt public sans activité
      # depuis 60 jours : un commit vide tous les ~45 jours l'évite.
      - name: Maintien des tâches planifiées
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "bonsplans-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "maintien des tâches planifiées"
            git push
          fi
